{% extends "base.html" %}
{% block content %}
<section class="history-shell animate-fade-up">
  <div class="section-card p-4 p-lg-5 mb-4">
    <span class="badge pill-prototype rounded-pill mb-2">Saved screens</span>
    <h1 class="page-heading mb-2">History</h1>
    <p class="mb-0">Each screening is tied to your profile so you can log back in and find it again.</p>
  </div>
  <div class="section-card p-4 p-lg-5">
    <div class="table-responsive">
      <table class="table table-borderless align-middle history-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>T21</th>
            <th>Status</th>
            <th>T18</th>
            <th>Status</th>
            <th>Model</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
    </div>
  </div>
</section>
{% endblock %}
