{% extends "base.html" %}
{% block content %}
<section class="screening-shell animate-fade-up">
  <div class="section-card p-4 p-lg-5 mb-4">
    <div class="d-flex flex-column flex-lg-row justify-content-between gap-3 align-items-start align-items-lg-center">
      <div>
        <span class="badge pill-prototype rounded-pill mb-2">Screening flow</span>
        <h1 class="page-heading mb-2">Start a new screening</h1>
        <p class="mb-0">Enter only the model inputs and submit to see the estimated chances.</p>
      </div>
      <div class="screening-note">
        <div class="fw-semibold">Saved automatically</div>
        <div class="small-muted">The result is added to your history after submission.</div>
      </div>
    </div>
  </div>
  <div class="section-card p-4 p-lg-5">
    <form id="screening-form">
      <div class="row g-3" id="screening-form-fields"></div>
      <div class="mt-4 d-flex flex-wrap gap-3">
        <button class="btn btn-primary btn-lg" type="submit">Run Prediction</button>
        <button class="btn btn-outline-secondary btn-lg" type="reset">Reset</button>
      </div>
      <div id="form-feedback" class="mt-3"></div>
    </form>
  </div>
</section>
{% endblock %}
