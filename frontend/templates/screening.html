{% extends "base.html" %}
{% block content %}
<div class="section-card p-4 p-lg-5 animate-fade-up">
  <div class="mb-4">
    <h1 class="h2 page-heading">Screening Form</h1>
    <p class="mb-0">Only the fields required by the trained model are displayed below.</p>
  </div>
  <form id="screening-form">
    <div class="row g-3" id="screening-form-fields"></div>
    <div class="mt-4 d-flex flex-wrap gap-3">
      <button class="btn btn-primary btn-lg" type="submit">Run Prediction</button>
      <button class="btn btn-outline-secondary btn-lg" type="reset">Reset</button>
    </div>
    <div id="form-feedback" class="mt-3"></div>
  </form>
</div>
{% endblock %}
